# The heavy vignettes are rendered here rather than on CRAN. `vignettes/*.Rmd`
# is generated from `vignettes/*.Rmd.orig` by `_dev/precompute-vignettes.R`,
# which runs every chunk once and writes the code, its output and its figures
# into the shipped file, so that building the package evaluates none of it.
# The two can only agree if one is generated from the other, so this workflow
# regenerates them and fails when the result differs from what was pushed.
#
# It runs on a push that touches a source vignette, the script, or the package
# code the vignettes run, and on request from the Actions tab, where a subset
# can be named. It commits whatever it regenerates back to the branch it ran
# on. A push made with the workflow's own token does not start another run, so
# that commit cannot trigger a loop.
name: Precompute vignettes

on:
  push:
    paths:
      - 'vignettes/**.Rmd.orig'
      - '_dev/precompute-vignettes.R'
      - 'R/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      vignettes:
        description: 'Vignettes to rebuild, space separated; empty for all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  precompute:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
        with:
          # The committing step needs the branch rather than a detached head.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown
            local::.
          needs: check

      - name: Install the package
        run: R CMD INSTALL --no-multiarch --with-keep.source .
        shell: bash

      - name: Precompute
        run: Rscript _dev/precompute-vignettes.R ${{ github.event.inputs.vignettes }}
        shell: bash

      - name: Report what changed
        id: changed
        run: |
          git add -A vignettes
          if git diff --cached --quiet; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            echo "The precomputed vignettes already match their sources."
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
        shell: bash

      - name: Commit the regenerated vignettes
        if: steps.changed.outputs.dirty == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild the precomputed vignettes

          Generated by _dev/precompute-vignettes.R from vignettes/*.Rmd.orig."
          git push
        shell: bash
